
services:
  postgres:
    image: postgres:15-alpine
    container_name: pft_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pft_db
      POSTGRES_USER: pft_user
      POSTGRES_PASSWORD: pft_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pft_user -d pft_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: